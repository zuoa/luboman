#
name: Create and publish Docker images

# 本 workflow 同时构建后端镜像 (ghcr.io/zuoa/luboman) 与前端镜像 (ghcr.io/zuoa/luboman-webui)。
# 前端源码位于 webui/ 子目录。两个 job 并行，均在 push 到 main 时触发。
on:
  push:
    branches: ['main']

env:
  REGISTRY: ghcr.io

jobs:
  # 后端镜像：构建上下文为仓库根，镜像名沿用 ${github.repository} = zuoa/luboman
  build-app:
    name: Build & push backend image (luboman)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
      - name: Build and push Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 前端镜像：构建上下文为 webui/，镜像名固定为 zuoa/luboman-webui（与 docker-compose 引用一致）。
  # 注意：该包当前由旧仓库 zuoa/luboman-webui 发布，需在 GitHub 包设置中给本仓库 zuoa/luboman 授予 Write 权限。
  build-webui:
    name: Build & push frontend image (luboman-web)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/luboman-web
      - name: Build and push Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./webui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
