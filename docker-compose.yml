version: "3"
# 服务配置
services:
  postgres:
    image: postgres:13.16
    command: postgres -c 'max_connections=300'
    container_name: luboman-postgres
    restart: always
    environment:
      - "TZ=Asia/Shanghai"
      - "POSTGRES_USER=luboman"
      - "POSTGRES_PASSWORD=luboman@2024#Hangzhou"
    ports:
      - 54321:5432
    volumes:
      - ./data/pgsql/data:/var/lib/postgresql/data
    networks:
      - bridge_net

  app:
    image: ghcr.io/zuoa/luboman:main
    # 完整版（main）含 Chrome，抖音投稿可用；不需要抖音投稿可换精简版 ghcr.io/zuoa/luboman:main-slim（小约 400MB）
    # image: 生产拉取已发布镜像；build: 供本地 `docker compose build` 从源码构建
    # 本地构建精简版：`docker compose build --build-arg WITH_DOUYIN=false`（或在 build 块加 args）
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luboman
    restart: "always"
    environment:
      - "TZ=Asia/Shanghai"
      - "DATABASE_HOST=postgres"
      - "DATABASE_PORT=5432"
      - "DATABASE_USER=luboman"
      - "DATABASE_PASSWORD=luboman@2024#Hangzhou"
      - "DATABASE_NAME=luboman"
    depends_on:
      - postgres
    ports:
      - "5005:5005"
    volumes:
      - ./data/app:/data
      - ~/.bypy:/root/.bypy
    networks:
      - bridge_net

  webui:
    image: ghcr.io/zuoa/luboman-webui:main
    # image: 生产拉取已发布镜像；build: 供本地 `docker compose build` 从 webui/ 源码构建
    build:
      context: ./webui
    container_name: luboman-webui
    restart: "always"
    environment:
      - "TZ=Asia/Shanghai"
    depends_on:
      - app
    links:
      - "app:luboman-service"
    ports:
      - "5001:5001"
    volumes:
      - ./data/app/video:/data/video:ro
    networks:
      - bridge_net

# 网络配置
networks:
  bridge_net:
    driver: bridge
